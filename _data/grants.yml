# Research grants, newest first. role_type: PI | Staff | Member
- program: "JST CREST AIP Challenge"
  title: "Deepfake Detection for eKYC Systems"
  url: "https://www.jst.go.jp/kisoken/aip/program/wakate/challenge/list2022.html"
  years: "2022 – 2023"
  role: "Principal Investigator"
  role_type: "PI"
  summary: "This project focused on developing robust and efficient solutions to protect electronic Know Your Customer (eKYC) verification systems from deepfake attacks."

- program: "JST CREST"
  title: "FakeMedia project"
  url: "http://research.nii.ac.jp/~iechizen/crest-e.html"
  years: "2020 – 2025"
  role: "Student, later staff member"
  role_type: "Staff"
  summary: "CREST FakeMedia addressed the potential threats posed by AI-generated fake media while developing social information technologies that support diverse forms of communication and decision-making."

- program: "JST CREST"
  title: "VoicePersonae project"
  url: "https://www.researchgate.net/project/JST-ANR-VoicePersonae-project"
  years: "2018 – 2023"
  role: "Student, later staff member"
  role_type: "Staff"
  summary: "VoicePersonae was an international collaboration among the National Institute of Informatics, Japan; the University of Avignon, France; and Eurecom, France, supported by JST CREST and ANR. Its research covered voice identity, including speech synthesis, voice conversion, speaker recognition, presentation attack detection, media forensics, speech anonymization, and speech privacy."

- program: "JSPS Kakenhi (S)"
  title: "Communication System for Defending against Attacks of Media Clones"
  url: "http://www2c.comm.eng.osaka-u.ac.jp/proj/mc/eindex.html"
  years: "2016 – 2021"
  role: "Student member"
  role_type: "Member"
  summary: "The distribution of inauthentic media poses a growing threat in everyday life, including fraud through voice impersonation of family members or friends. This project aimed to protect recipients from such skillfully fabricated replicas of authentic media—known as media clones—through media-processing technologies for a safer and more reliable society."
