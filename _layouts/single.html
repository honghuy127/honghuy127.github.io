---
layout: default
---

<div class="container layout{% if page.author_profile %} layout--with-profile{% endif %}">
  {% if page.author_profile %}{% include author-profile.html %}{% endif %}

  <article class="page">
    {% if page.title %}
      <header class="page-header">
        <h1>{{ page.title }}</h1>
        {% if page.lead %}<p class="page-header__lead">{{ page.lead }}</p>{% endif %}
      </header>
    {% endif %}

    <div class="page-content">
      {{ content }}
    </div>
  </article>
</div>
