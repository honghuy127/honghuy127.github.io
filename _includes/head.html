<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% include seo.html %}

<script>
  document.documentElement.classList.replace("no-js", "js");
  try {
    var theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (error) {}
</script>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" href="{{ '/images/site-logo-192.png' | relative_url }}" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#f7fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d151e" media="(prefers-color-scheme: dark)">
