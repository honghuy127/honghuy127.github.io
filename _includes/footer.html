<footer class="site-footer">
  <div class="container site-footer__inner">
    <div>
      <p class="site-footer__name">{{ site.author.name }}</p>
      <p>{{ site.description }}</p>
    </div>
    {% include profile-links.html icons_only=true %}
    <p class="site-footer__meta">
      &copy; {{ site.time | date: '%Y' }} {{ site.author.name }} · Last updated {{ site.time | date: '%B %Y' }} ·
      <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a> ·
      Built with <a href="https://jekyllrb.com">Jekyll</a>, based on <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>
    </p>
  </div>
</footer>
