{% assign author = site.author %}
<aside class="profile" aria-label="About {{ author.name }}">
  <div class="profile__identity">
    <picture class="profile__avatar">
      <source srcset="{{ '/images/profile-480.webp' | relative_url }}" type="image/webp">
      <img src="{{ '/images/profile-480.jpg' | relative_url }}" alt="" width="480" height="480">
    </picture>
    <div>
      <p class="profile__name"><a href="{{ '/' | relative_url }}">{{ author.name }}</a></p>
      <p class="profile__role">{{ author.positions | join: "<br>" }}</p>
    </div>
  </div>
  {% include profile-links.html %}
</aside>
