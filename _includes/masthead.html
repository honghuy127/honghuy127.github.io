<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <button class="icon-button nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      {% include icon.html name="menu" class="icon--menu" %}{% include icon.html name="close" class="icon--close" %}
      <span class="visually-hidden">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for link in site.data.navigation.main %}
          {% if link.url contains '://' %}{% assign href = link.url %}{% else %}{% assign href = link.url | relative_url %}{% endif %}
          <li><a href="{{ href }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button class="icon-button theme-toggle" type="button" aria-label="Toggle dark theme" aria-pressed="false">
      {% include icon.html name="moon" class="icon--moon" %}{% include icon.html name="sun" class="icon--sun" %}
    </button>
  </div>
</header>
