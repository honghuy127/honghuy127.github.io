name: Verify site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir _site '_site/**/*.html'
